<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Cresavo · Round two symbol studies</title>
<style>
  * { box-sizing: border-box }
  :root { --plum: #50364b; --apricot: #f2b184; --paper: #faf7f3; --night: #18141e }
  body { width: 1800px; margin: 0; color: var(--plum); background: var(--paper); font-family: Inter, Arial, sans-serif }
  header, .heading, .title, .usage, .small, .tiles { display: flex; align-items: center }
  header { padding: 40px 42px; background: var(--plum); color: var(--paper); justify-content: space-between }
  .title { gap: 35px }
  header img { width: 246px }
  h1 { margin: 0; padding-left: 35px; border-left: 1px solid #beb4bd; font-size: 33px; font-weight: 400; letter-spacing: -.035em }
  header p { margin: 0; color: var(--apricot); font-size: 24px; letter-spacing: -.025em }
  .heading { min-height: 102px; padding: 0 42px; gap: 28px; background: #f4efeb; border-top: 1px solid #8e8289 }
  h2 { margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -.05em }
  .heading p { margin: 0; font-size: 22px; letter-spacing: -.024em }
  .decision { margin-left: auto; font-size: 17px; font-weight: 600 }
  .panels { display: flex }
  .panel { width: 50%; padding: 26px 30px 30px; --muted: #6f666f; --ground: var(--apricot); --rule: #d5cbc9 }
  .dark { color: #fbf5f0; background: var(--night); --ground: var(--plum); --muted: #beb4bd; --rule: #504851 }
  h3, figcaption, .caption { margin: 0; font-size: 15px; line-height: 20px; font-weight: 500; color: var(--muted) }
  h3 { margin-bottom: 14px; color: inherit; font-size: 18px; font-weight: 600 }
  figure { margin: 0 }
  .specimens { display: grid; grid-template-columns: 512px 1fr; column-gap: 28px }
  .tile { background: var(--ground); display: grid; place-items: center; border-radius: 22% }
  .tile img { width: 75%; display: block }
  .hero { width: 512px; height: 512px }
  .app { width: 180px; height: 180px }
  .avatar { width: 64px; height: 64px; border-radius: 50% }
  figcaption { padding-top: 8px }
  .details { height: 512px; display: flex; flex-direction: column; justify-content: space-between }
  .usage { justify-content: space-between; gap: 12px; min-height: 68px }
  .usage img, .usage svg, .small img { display: block }
  .group { border-bottom: 1px solid var(--rule); padding: 0 0 14px }
  .small { align-items: flex-end; justify-content: space-between; width: 226px; padding-top: 4px }
  .small img { margin-inline: auto }
  .small figcaption { text-align: center }
  .tiles { align-items: flex-end; gap: 20px }
  .tiles figcaption { white-space: nowrap }
</style>
<header>
  <div class="title">
    <img src="../../brand/cresavo-v0.1/wordmark/cresavo-wordmark-dark.svg" alt="Cresavo">
    <h1>Symbol studies · Round two</h1>
  </div>
  <p>More time. On your terms.</p>
</header>
<main></main>
<script>
  const studies = [
    ['open-hour', 'Open hour', 'An arched frame, a low sill and a door left ajar.'],
    ['cutaway-c', 'Cutaway c', 'A diagonal folds into the counter of the first letter.'],
    ['folded-slip', 'Folded slip', 'A paper appointment slip curls back on itself.'],
    ['between-visits', 'Between visits', 'Two offset bowls leave a short pause between appointments.']
  ];

  function lockup(id, dark, stacked) {
    const width = stacked ? 108 : 172;
    const suffix = dark ? '-dark' : '';
    const orientation = stacked ? 'stacked' : 'horizontal';
    if (id === 'open-hour') {
      return `<img width="${width}" src="../../logo/lockup-${orientation}${suffix}.svg" alt="Cresavo">`;
    }
    const wordmark = `../../brand/cresavo-v0.1/wordmark/cresavo-wordmark-${dark ? 'dark' : 'light'}.svg`;
    const symbol = `${id}/symbol${suffix}.svg`;
    const box = stacked ? '0 0 140 79' : '0 0 178 30';
    const [x, y, size] = stacked ? [44, -4, 53.76] : [-2.5, -2, 34.56];
    return `<svg width="${width}" viewBox="${box}" role="img" aria-label="Cresavo">
      <image href="${symbol}" x="${x}" y="${y}" width="${size}" height="${size}"/>
      <image href="${wordmark}" x="${stacked ? 0 : 38}" y="${stacked ? 56.8 : 4}" width="139.84" height="22.14"/>
    </svg>`;
  }

  function panel(id, dark) {
    const src = `${id}/symbol${dark ? '-dark' : ''}.svg`;
    const icon = (kind, label) => `<figure><div class="tile ${kind}"><img src="${src}" alt=""></div><figcaption>${label}</figcaption></figure>`;
    const sizes = [16, 32, 64].map(size => `<figure><img src="${src}" width="${size}" height="${size}" alt=""><figcaption>${size} px</figcaption></figure>`).join('');
    return `<div class="panel ${dark ? 'dark' : ''}"><h3>${dark ? 'Dark' : 'Light'}</h3>
      <div class="specimens">${icon('hero', 'App icon · 512 px')}
        <div class="details">
          <div class="usage group">${lockup(id, dark, false)}<span class="caption">Horizontal</span></div>
          <div class="usage group">${lockup(id, dark, true)}<span class="caption">Stacked</span></div>
          <div class="small">${sizes}</div>
          <div class="tiles">${icon('app', 'App icon · 180 px')}${icon('avatar', 'Avatar · 64 px')}</div>
        </div>
      </div></div>`;
  }

  document.querySelector('main').innerHTML = studies.map(([id, name, caption]) => `
    <section><div class="heading"><h2>${name}</h2><p>${caption}</p>
      ${id === 'open-hour' ? '<span class="decision">Recommended for launch</span>' : ''}
    </div><div class="panels">${panel(id, false)}${panel(id, true)}</div></section>`).join('');
</script>
</html>
