openapi: 3.1.0
info:
  title: Booking Lab Agent API
  version: "1.0.0-sandbox"
  description: |
    Read-only v1 for AI agents: list services and look up available times in the
    synthetic Booking Lab demo salon. All data is synthetic. Booking creation,
    rescheduling and cancellation are not part of v1.
    Every key belongs to one business plus a named agent and a responsible person.
servers:
  - url: http://localhost:3000
security:
  - bearerKey: []
  - apiKeyHeader: []
paths:
  /api/v1/services:
    get:
      summary: List active services for a business
      parameters:
        - $ref: "#/components/parameters/business"
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicesResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/availability:
    get:
      summary: Available start times for a service
      description: Use either `date`, or `from` (+ optional `to`). At most 14 days per request. The engine only offers days from today up to 60 days ahead.
      parameters:
        - $ref: "#/components/parameters/business"
        - { name: service, in: query, required: true, schema: { type: string }, example: fotvard }
        - { name: date, in: query, schema: { type: string, format: date }, example: "2026-11-16" }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: staff, in: query, schema: { type: string }, description: Optional staff id filter }
      responses:
        "200":
          description: Slots sorted by start, then staff id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerKey: { type: http, scheme: bearer, description: "Authorization: Bearer blk_<prefix>_<secret>" }
    apiKeyHeader: { type: apiKey, in: header, name: X-API-Key }
  parameters:
    business:
      { name: business, in: query, required: true, schema: { type: string }, example: demo, description: Must equal the key's business. }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Business:
      type: object
      required: [id, name, timeZone]
      properties:
        id: { type: string }
        name: { type: string }
        timeZone: { type: string, example: Europe/Stockholm }
    Staff:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string } }
    Service:
      type: object
      required: [id, name, durationMinutes, bufferMinutes, price, version, staff]
      properties:
        id: { type: string }
        name: { type: string }
        durationMinutes: { type: integer }
        bufferMinutes: { type: integer }
        price:
          type: object
          required: [amountMinor, currency]
          properties:
            amountMinor: { type: integer, description: Öre (1/100 SEK) }
            currency: { type: string, const: SEK }
        version: { type: integer, description: Service version; a future booking endpoint will require it. }
        staff: { type: array, items: { $ref: "#/components/schemas/Staff" } }
    Slot:
      type: object
      required: [start, end, durationMinutes, serviceId, serviceVersion, staff]
      properties:
        start: { type: string, format: date-time, example: "2026-11-16T09:00:00+01:00" }
        end: { type: string, format: date-time, example: "2026-11-16T10:00:00+01:00" }
        durationMinutes: { type: integer }
        serviceId: { type: string }
        serviceVersion: { type: integer }
        staff: { $ref: "#/components/schemas/Staff" }
    ServicesResponse:
      type: object
      required: [apiVersion, business, services]
      properties:
        apiVersion: { type: string, const: v1 }
        business: { $ref: "#/components/schemas/Business" }
        services: { type: array, items: { $ref: "#/components/schemas/Service" } }
    AvailabilityResponse:
      type: object
      required: [apiVersion, business, service, range, slots]
      properties:
        apiVersion: { type: string, const: v1 }
        business: { $ref: "#/components/schemas/Business" }
        service: { $ref: "#/components/schemas/Service" }
        range:
          type: object
          required: [from, to, timeZone]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            timeZone: { type: string }
        slots: { type: array, items: { $ref: "#/components/schemas/Slot" } }
    Error:
      type: object
      required: [apiVersion, error]
      properties:
        apiVersion: { type: string, const: v1 }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden_scope, forbidden_business, business_not_found, service_not_found, staff_not_found, invalid_request, range_too_large, rate_limited, internal_error]
            message: { type: string }
