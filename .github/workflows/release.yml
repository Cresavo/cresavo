name: Release

# Publishes a GitHub release when a merged release PR bumps "version" in package.json.
# Notes come from docs/releases/v<version>.md, or the matching CHANGELOG section if that file is missing.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish the release if this version has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          flags=()
          # 0.x versions are pre-releases while Cresavo is a concept demo.
          case "$version" in 0.*|*-*) flags+=(--prerelease) ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" --title "Cresavo ${version}" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
