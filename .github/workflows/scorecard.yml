# OpenSSF Scorecard (https://github.com/ossf/scorecard-action).
# Note: this only becomes useful once the repository is public. On a private
# repository most checks cannot run and results are not published.
name: Scorecard supply-chain security
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"
      timezone: Europe/Stockholm
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload results to the code scanning dashboard.
      security-events: write
      # Publish results and get a badge (OIDC token).
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep SARIF as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
