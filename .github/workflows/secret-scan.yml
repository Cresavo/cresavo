name: Secret scan
# Pull requests and main only, like verify.yml, to save Actions minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Why the official image and not gitleaks/gitleaks-action: the action
      # needs a paid licence key for organisation-owned private repositories.
      # The MIT-licensed CLI in the official image needs none. The image is
      # pinned by the digest of the v8.30.1 multi-arch index; bump the tag
      # comment and the digest together (Dependabot does not track this).
      # Redaction keeps any match out of the job log. Rules and the reviewed
      # allowlist live in .gitleaks.toml.
      - name: Scan full history
        env:
          # ghcr.io/gitleaks/gitleaks v8.30.1
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/repo" \
            -w /repo \
            "$GITLEAKS_IMAGE" \
            git --config /repo/.gitleaks.toml --redact --no-banner --verbose /repo
