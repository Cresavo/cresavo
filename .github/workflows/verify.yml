name: Verify POC
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    name: E2E ${{ matrix.mode }} / proxy ${{ matrix.proxy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, production]
        proxy: ["0", "1"]
    env:
      E2E_PRODUCTION: ${{ matrix.mode == 'production' && '1' || '' }}
      TRUST_PROXY_IP: ${{ matrix.proxy }}
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:5432/booking_ci_test
      ADMIN_PASSWORD: synthetic-ci-password-only
      SESSION_SECRET: synthetic-ci-session-secret-never-use-in-deployment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm ci
      - run: |
          touch .env
          docker compose up -d --wait
          docker compose exec -T db createdb -U booking booking_ci_test
          npx prisma generate
          npm run db:migrate
          npm run db:seed
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        run: npm run lint
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        run: npm test
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npx tsc --noEmit
      - if: always()
        run: docker compose down

  dependency-audit:
    name: Dependency audit (known advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm audit
