name: Verify POC
# Runs on pull requests and on main only. Agent branches run the same gates
# locally before pushing. Pull requests always run, also for docs-only
# changes, so a required status check never waits for a run that was skipped.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    name: E2E ${{ matrix.mode }} / proxy ${{ matrix.proxy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '[{"mode":"dev","proxy":"0"},{"mode":"dev","proxy":"1"},{"mode":"production","proxy":"0"},{"mode":"production","proxy":"1"}]' || '[{"mode":"dev","proxy":"0"}]') }}
    env:
      E2E_PRODUCTION: ${{ matrix.mode == 'production' && '1' || '' }}
      TRUST_PROXY_IP: ${{ matrix.proxy }}
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:5432/booking_ci_test
      SESSION_SECRET: synthetic-ci-session-secret-never-use-in-deployment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: |
          touch .env
          docker compose up -d --wait
          docker compose exec -T db createdb -U booking booking_ci_test
          npx prisma generate
          npm run db:migrate
          npm run db:seed
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        run: npm run lint
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        run: npm test
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        run: npm run test:integration
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}
      # OS packages are not part of the browser cache.
      - run: npx playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run build
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        name: Local MCP card and booking proof (test host)
        run: |
          npx playwright test --config playwright.agent-workday.config.ts
      - run: npm run test:e2e
      - run: npx tsc --noEmit
      - if: always()
        run: docker compose down
  concept:
    # The browser demo (studio and booking page). It runs without a database:
    # demo state lives in the browser. One job per viewport so they run in parallel.
    name: Concept E2E ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [mobile, desktop]
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright test --config playwright.concept.config.ts --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concept-e2e-${{ matrix.project }}
          path: test-results/
          retention-days: 7
  staging-consent:
    # The split-mode customer consent channel over HTTPS (docs/CUSTOMER_CONSENT_CHANNEL.md).
    # Needs read access to the private gateway repository. Runs only on main, for pushes and
    # manual runs, never on pull request events or other branches and tags, so private
    # gateway code and the read token are never used for code that has not been merged.
    # Without the secret the job reports a notice and runs nothing else.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Staging consent channel (HTTPS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_GATEWAY_TOKEN: ${{ secrets.GATEWAY_READ_TOKEN != '' }}
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - if: env.HAS_GATEWAY_TOKEN != 'true'
        run: echo "::notice title=Staging consent channel skipped::No gateway read access for this run (GATEWAY_READ_TOKEN missing)."
      - if: env.HAS_GATEWAY_TOKEN == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: cresavo
          persist-credentials: false
      - if: env.HAS_GATEWAY_TOKEN == 'true'
        id: pin
        run: echo "revision=$(node -p 'require("./cresavo/scripts/staging-consent/gateway.json").gatewayRevision')" >> "$GITHUB_OUTPUT"
      # The token is used only for this checkout and is not persisted in the Git config.
      - if: env.HAS_GATEWAY_TOKEN == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Cresavo/gateway
          ref: ${{ steps.pin.outputs.revision }}
          token: ${{ secrets.GATEWAY_READ_TOKEN }}
          path: gateway
          persist-credentials: false
      - if: env.HAS_GATEWAY_TOKEN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cresavo/package-lock.json
      - if: env.HAS_GATEWAY_TOKEN == 'true'
        working-directory: cresavo
        run: |
          npm ci
          npx prisma generate
          docker compose up -d --wait
      - if: env.HAS_GATEWAY_TOKEN == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('cresavo/package-lock.json') }}
      - if: env.HAS_GATEWAY_TOKEN == 'true'
        working-directory: cresavo
        run: npx playwright install-deps chromium
      - if: env.HAS_GATEWAY_TOKEN == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: cresavo
        run: npx playwright install chromium
      # Prints sanitized check codes only. No artifacts are uploaded from this job.
      - if: env.HAS_GATEWAY_TOKEN == 'true'
        working-directory: cresavo
        env:
          GATEWAY_CHECKOUT: ${{ github.workspace }}/gateway
        run: npm run test:staging-consent
      - if: always() && env.HAS_GATEWAY_TOKEN == 'true'
        working-directory: cresavo
        run: docker compose down
