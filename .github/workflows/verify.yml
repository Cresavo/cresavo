name: Verify POC
# Runs on pull requests and on main only. Agent branches run the same gates
# locally before pushing. Pull requests always run, also for docs-only
# changes, so a required status check never waits for a run that was skipped.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    name: E2E ${{ matrix.mode }} / proxy ${{ matrix.proxy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '[{"mode":"dev","proxy":"0"},{"mode":"dev","proxy":"1"},{"mode":"production","proxy":"0"},{"mode":"production","proxy":"1"}]' || '[{"mode":"dev","proxy":"0"}]') }}
    env:
      E2E_PRODUCTION: ${{ matrix.mode == 'production' && '1' || '' }}
      TRUST_PROXY_IP: ${{ matrix.proxy }}
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:5432/booking_ci_test
      SESSION_SECRET: synthetic-ci-session-secret-never-use-in-deployment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: |
          touch .env
          docker compose up -d --wait
          docker compose exec -T db createdb -U booking booking_ci_test
          npx prisma generate
          npm run db:migrate
          npm run db:seed
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        run: npm run lint
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        run: npm test
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        run: npm run test:integration
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        name: Validate an isolated provider with the gateway kit
        env:
          DATABASE_URL: postgresql://booking:booking@127.0.0.1:5432/cresavo_sandbox_ci_test
          SANDBOX_ORDINARY_DATABASE_URL: postgresql://booking:booking@127.0.0.1:5432/booking_ci_test
          SANDBOX_TEST_INSTALLATION_ID: 0196a07e-f751-48fa-8a1c-8e53e034a120
          BOOKING_SANDBOX_TESTS: "1"
          SANDBOX_GATEWAY_CHECKOUT: ${{ runner.temp }}/cresavo-gateway-provider-kit
        run: |
          docker compose exec -T db createdb -U booking cresavo_sandbox_ci_test
          docker compose exec -T db psql -U booking -d cresavo_sandbox_ci_test \
            -v ON_ERROR_STOP=1 -v installation_id="$SANDBOX_TEST_INSTALLATION_ID" < scripts/sandbox/mark.sql
          npm run db:migrate
          docker compose exec -T db psql -U booking -d cresavo_sandbox_ci_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE sandbox_runtime LOGIN PASSWORD 'sandbox-ci-only'"
          docker compose exec -T db psql -U booking -d cresavo_sandbox_ci_test \
            -v ON_ERROR_STOP=1 -v runtime_role=sandbox_runtime < scripts/sandbox/runtime-grants.sql
          docker compose exec -T db psql -U booking -d cresavo_sandbox_ci_test -v ON_ERROR_STOP=1 -c "CREATE ROLE sandbox_reset_runtime LOGIN PASSWORD 'sandbox-reset-ci-only'; CREATE ROLE sandbox_reset_previous LOGIN"
          docker compose exec -T db psql -U booking -d cresavo_sandbox_ci_test -v ON_ERROR_STOP=1 -v reset_role=sandbox_reset_previous < scripts/sandbox/reset.sql
          docker compose exec -T db psql -U booking -d cresavo_sandbox_ci_test -v ON_ERROR_STOP=1 -v reset_role=sandbox_reset_runtime < scripts/sandbox/reset.sql
          export SANDBOX_TEST_PRIOR_RESET_ROLE=sandbox_reset_previous
          export SANDBOX_TEST_MIGRATION_DATABASE_URL="$DATABASE_URL"
          export SANDBOX_TEST_RESET_DATABASE_URL=postgresql://sandbox_reset_runtime:sandbox-reset-ci-only@127.0.0.1:5432/cresavo_sandbox_ci_test
          export DATABASE_URL=postgresql://sandbox_runtime:sandbox-ci-only@127.0.0.1:5432/cresavo_sandbox_ci_test
          git init "$SANDBOX_GATEWAY_CHECKOUT"
          git -C "$SANDBOX_GATEWAY_CHECKOUT" fetch --depth 1 https://github.com/Cresavo/gateway.git 13fb1f855fea84bbcd3131959f1814e1d405a0fd
          git -C "$SANDBOX_GATEWAY_CHECKOUT" switch --detach FETCH_HEAD
          npm run test:integration -- tests/integration/sandbox-provider.test.ts tests/integration/sandbox-phone.test.ts tests/integration/sandbox-reset.test.ts
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}
      # OS packages are not part of the browser cache.
      - run: npx playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        name: Verify the sandbox phone with a browser through the gateway
        env:
          DATABASE_URL: postgresql://sandbox_runtime:sandbox-ci-only@127.0.0.1:5432/cresavo_sandbox_ci_test
          SANDBOX_TEST_INSTALLATION_ID: 0196a07e-f751-48fa-8a1c-8e53e034a120
          SANDBOX_GATEWAY_CHECKOUT: ${{ runner.temp }}/cresavo-gateway-provider-kit
          SANDBOX_BROWSER_TLS: ${{ runner.temp }}/cresavo-sandbox-browser-tls
        run: |
          npm --prefix "$SANDBOX_GATEWAY_CHECKOUT" ci --ignore-scripts
          mkdir -m 700 "$SANDBOX_BROWSER_TLS"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 -subj /CN=localhost \
            -addext subjectAltName=IP:127.0.0.1 -keyout "$SANDBOX_BROWSER_TLS/local-key.pem" \
            -out "$SANDBOX_BROWSER_TLS/local-cert.pem" 2>/dev/null
          NODE_EXTRA_CA_CERTS="$SANDBOX_BROWSER_TLS/local-cert.pem" npm run test:integration -- tests/integration/sandbox-browser.test.ts
      - run: npm run build
      - if: matrix.mode == 'dev' && matrix.proxy == '0'
        name: Local MCP card and booking proof (test host)
        run: |
          npx playwright test --config playwright.agent-workday.config.ts
      - run: npm run test:e2e
      - run: npx tsc --noEmit
      - if: always()
        run: docker compose down
  concept:
    # The browser demo (studio and booking page). It runs without a database:
    # demo state lives in the browser. One job per viewport so they run in parallel.
    name: Concept E2E ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [mobile, desktop]
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright test --config playwright.concept.config.ts --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concept-e2e-${{ matrix.project }}
          path: test-results/
          retention-days: 7
