name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Use synthetic data only. For vulnerabilities, use private reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /studio\n2. ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device / version
