name: Feature request
description: Suggest an improvement
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Cresavo is an early concept demo. Small, concrete ideas tied to a real problem are easiest to act on.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve, and for whom?
      placeholder: "As a salon owner, when a client cancels I ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md)
