services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_lab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_lab"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  booking_data:
