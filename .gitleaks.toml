# Gitleaks configuration. Extends the upstream default ruleset; only verified
# false positives are allowlisted below. Do not add a path or regex here
# without checking that the match is synthetic and documented in the repo.
title = "Cresavo gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Documented synthetic demo values"
regexes = [
  # Public demo bearer token for the concept API; documented in
  # .env.example and defined as DEV_TOKEN in src/concept/server/token.ts.
  '''flerdo-demo-token''',
  # Throwaway SESSION_SECRET used only by the CI workflow (verify.yml);
  # the name itself says it must never be used in a deployment.
  '''synthetic-ci-session-secret-never-use-in-deployment''',
]

# Test fixtures with fictional values (verified by reading the lines; the
# values are obviously made up, e.g. "fictional-key-1234" or "synthetic-...").
[[allowlists]]
description = "Fictional test fixture values"
condition = "AND"
paths = ['''^tests/(concept-ai-settings|agent-preview|mcp-workspace|navigation-context)\.test\.ts$''']
regexTarget = "match"
# Only these exact literals; any other value in these files is still reported.
regexes = [
  '''key: "fictional-key-1234"''',
  '''SESSION_SECRET: "synthetic-test-placeholder-32-characters"''',
  '''key = "a9c446e7-ccba-48ad-b729-de703edc847c"''',
  '''secret = "synthetic-secret-at-least-32-characters"''',
]

# Recorded verification transcript (removed from the tree before the public
# release; kept so full-history scans stay clean): expectedToken is a 64-hex SHA-256 digest
# of a synthetic token, not a credential.
[[allowlists]]
description = "Verification transcript digests"
condition = "AND"
paths = ['''^docs/(archive/)?verification/lifecycle/owner-tool-transcript\.json$''']
regexTarget = "line"
regexes = ['''"expectedToken":\s*"[0-9a-f]{64}"''']

# Swedish prose in architecture/verification docs ("tokenhash," and
# "Vercel-auth," are words, not secrets).
[[allowlists]]
description = "Prose false positives in docs"
condition = "AND"
paths = ['''^docs/(archive/)?(ARCHITECTURE|VERIFICATION)\.md$''']
regexTarget = "line"
regexes = ['''(tokenhash|Vercel-auth),''']

# Connections contract tests (branch feat/connections-foundation, 2026-11-18):
# fictional provider keys passed to adapters and the secret-leak test.
# Reviewed one by one: none matches a real credential format (wrong length
# or charset for Stripe sk_/whsec_, Twilio, 46elks, Resend and Svix),
# most contain ascending runs such as "abcd"/"1234", and they were written
# in a sandbox with no provider credentials or provider network access.
# Scoped to the three commits that introduced them AND these four files,
# so the same values anywhere else, or new keys in these files in later
# commits, are still reported.
[[allowlists]]
description = "Fictional keys in connections contract tests"
condition = "AND"
commits = [
  "71858e216cd0abfad93a3bdf314519b4a8daec24",
  "11966a6bd90723ffdcc1322c5ace918ff1505544",
  "ebcd4ad1b754b632647082daf931792147db46a5",
]
paths = ['''^tests/concept-connections-(secrets|routes|payments|messaging)\.test\.ts$''']
